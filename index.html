/* =========================================================
   NORMALIZA TEXTO
   ========================================================= */

function normalizarTexto(texto) {

  return String(texto || "")
    .normalize("NFD")
    .replace(
      /[\u0300-\u036f]/g,
      ""
    )
    .toLowerCase()
    .trim();

}


/* =========================================================
   FORMATA CEP
   ========================================================= */

cepInput.addEventListener(
  "input",
  function(event) {

    let valor =
      event.target.value
        .replace(/\D/g, "");

    if (
      valor.length > 5
    ) {

      valor =
        valor.substring(0, 5) +
        "-" +
        valor.substring(5, 8);

    }

    event.target.value =
      valor.substring(0, 9);

  }
);


/* =========================================================
   DISTÂNCIA EM LINHA RETA
   ========================================================= */

function calcularDistancia(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R =
    6371;

  const dLat =
    (
      lat2 - lat1
    ) *
    Math.PI /
    180;

  const dLon =
    (
      lon2 - lon1
    ) *
    Math.PI /
    180;

  const a =
    Math.sin(
      dLat / 2
    ) *
    Math.sin(
      dLat / 2
    ) +

    Math.cos(
      lat1 *
      Math.PI /
      180
    ) *

    Math.cos(
      lat2 *
      Math.PI /
      180
    ) *

    Math.sin(
      dLon / 2
    ) *
    Math.sin(
      dLon / 2
    );

  const c =
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );

  return R * c;

}


/* =========================================================
   VIA CEP
   ========================================================= */

async function consultarCEP(
  cep
) {

  const response =
    await fetch(
      "https://viacep.com.br/ws/" +
      cep +
      "/json/"
    );

  if (
    !response.ok
  ) {

    throw new Error(
      "Falha no ViaCEP"
    );

  }

  const dados =
    await response.json();

  if (
    dados.erro
  ) {

    return null;

  }

  return dados;

}

  cep,

    "?format=jsonv2" +
    "&limit=1" +
    "&countrycodes=br" +
    "&q=" +
    encodeURIComponent(
      [
        dados.logradouro,
        dados.bairro,
        dados.localidade,
        dados.uf,
        "Brasil"
      ]
      .filter(Boolean)
      .join(", ")
    )

  ];


  for (
    const url of consultas
  ) {

    try {

      const response =
        await fetch(
          url,
          {
            headers: {
              "Accept":
                "application/json"
            }
          }
        );


      if (
        !response.ok
      ) {

        continue;

      }


      const resultados =
        await response.json();


      if (
        resultados &&
        resultados.length
      ) {

        const lat =
          parseFloat(
            resultados[0].lat
          );

        const lon =
          parseFloat(
            resultados[0].lon
          );


        if (
          Number.isFinite(lat) &&
          Number.isFinite(lon)
        ) {

          return {
            lat: lat,
            lon: lon
          };

        }

      }

    }
    catch (erro) {

      console.error(
        "Erro no Nominatim:",
        erro
      );

    }

  }


  return null;

}


/* =========================================================
   BUSCA CRAS POR ABRANGÊNCIA

   Esta é a principal correção.

   Se a Prefeitura informa que o CRAS atende o bairro,
   ele tem prioridade sobre uma unidade distante que
   simplesmente esteja próxima por coordenada.
   ========================================================= */

function encontrarCRASPorAbrangencia(
  bairro
) {

  const bairroNormalizado =
    normalizarTexto(
      bairro
    );


  if (
    !bairroNormalizado
  ) {

    return [];

  }


  return cras.filter(
    unidade =>

      unidade.abrangencia.some(
        area =>

          normalizarTexto(
            area
          ) ===
          bairroNormalizado
      )

  );

}


/* =========================================================
   ENCONTRA MAIS PRÓXIMO
   ========================================================= */

function encontrarMaisProxima(
  latitude,
  longitude,
  unidades
) {

  if (
    !Number.isFinite(latitude) ||
    !Number.isFinite(longitude)
  ) {

    return null;

  }


  if (
    !unidades ||
    !unidades.length
  ) {

    return null;

  }


  let melhor =
    null;


  unidades.forEach(
    unidade => {

      const distancia =
        calcularDistancia(
          latitude,
          longitude,
          unidade.lat,
          unidade.lon
        );


      if (
        !melhor ||
        distancia <
        melhor.distancia
      ) {

        melhor = {
          ...unidade,
          distancia:
            distancia
        };

      }

    }
  );


  return melhor;

}


/* =========================================================
   ESCOLHE CRAS

   REGRA:

   1. Se houver CRAS oficialmente associado ao bairro,
      usa somente essas unidades.

   2. Caso não haja associação conhecida,
      usa a distância entre todas as unidades cadastradas.

   Isso impede o erro que estava acontecendo no Centro
   e em Rocha Miranda.
   ========================================================= */

function escolherCRAS(
  latitude,
  longitude,
  bairro
) {

  const candidatos =
    encontrarCRASPorAbrangencia(
      bairro
    );


  if (
    candidatos.length
  ) {

    return encontrarMaisProxima(
      latitude,
      longitude,
      candidatos
    );

  }


  return encontrarMaisProxima(
    latitude,
    longitude,
    cras
  );

}
