<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <title>Conheça seus direitos</title>

  <style>
    :root {
      --card: #f8f2ee;
      --primary: #d37586;
      --primary-dark: #b5526e;
      --text: #402d35;
      --muted: #7b5d65;
      --line: rgba(96, 63, 71, 0.18);
      --button: #d98ca1;
      --button-dark: #b9617d;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(
          circle at top,
          #f9f0eb 0%,
          #f1e4df 35%,
          #e8d8d2 100%
        );
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      padding: 20px;
    }

    .card {
      width: 420px;
      max-width: 100%;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(120, 83, 91, 0.15);
      border-radius: 22px;
      box-shadow: 0 18px 30px rgba(86, 50, 58, 0.12);
      padding: 18px;
      backdrop-filter: blur(2px);
    }

    .inner {
      background: var(--card);
      border: 1px solid rgba(116, 73, 82, 0.08);
      border-radius: 18px;
      padding: 18px;
    }

    .title {
      text-align: center;
      font-weight: 800;
      font-size: 1.05rem;
      letter-spacing: 0.04em;
      color: #6a4650;
      margin: 0 0 16px;
      line-height: 1.3;
    }

    .search-label {
      display: block;
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 8px;
      text-align: center;
      font-weight: 700;
    }

    .search {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .input-wrap {
      width: 100%;
    }

    .input {
      width: 100%;
      height: 38px;
      border: 1px solid rgba(116, 73, 82, 0.18);
      border-radius: 8px;
      background: var(--white);
      padding: 0 12px;
      font-size: 0.98rem;
      color: var(--text);
      outline: none;
    }

    .input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(211, 117, 134, 0.12);
    }

    .input::placeholder {
      color: #b19aa4;
    }

    .button {
      height: 38px;
      min-width: 104px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(
        180deg,
        var(--button) 0%,
        var(--button-dark) 100%
      );
      color: #fff;
      font-weight: 700;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: 0.15s;
    }

    .button:hover {
      transform: translateY(-1px);
    }

    .button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .divider {
      border-top: 1px solid var(--line);
      margin: 18px 0 12px;
    }

    .result {
      background: #fff;
      border: 1px solid rgba(116, 73, 82, 0.12);
      border-radius: 10px;
      padding: 12px;
      margin: 14px 4px;
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.5;
    }

    .result-title {
      color: var(--text);
      font-weight: 800;
      margin-bottom: 5px;
    }

    .service {
      display: grid;
      grid-template-columns: 36px 1fr;
      gap: 10px;
      padding: 8px 4px 6px;
    }

    .icon {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(221, 170, 186, 0.22);
      display: grid;
      place-items: center;
      font-size: 1.2rem;
      margin-top: 2px;
    }

    .service-card {
      padding: 0;
    }

    .service-name {
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--text);
      margin: 0 0 6px;
    }

    .address {
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.5;
      margin: 0 0 4px;
    }

    .distance {
      font-size: 0.76rem;
      color: var(--muted);
      margin: 0 0 8px;
    }

    .phone {
      font-size: 0.76rem;
      color: var(--muted);
      margin: 0 0 8px;
    }

    .hours {
      font-size: 0.76rem;
      color: var(--muted);
      margin: 0 0 8px;
    }

    .cta {
      display: inline-block;
      height: 28px;
      padding: 0 12px;
      border: none;
      background: rgba(201, 118, 146, 0.1);
      color: var(--primary-dark);

      text-decoration: none;
      margin-right: 5px;
      margin-bottom: 5px;

    }

      color: #39704a;
    }

    .error {
      color: #9a4357;
      background: #fff4f5;
      border: 1px solid #ecc8cf;
    }

      body {
        padding: 12px;
      }

      .card {
        width: 100%;
      }

      .search {
        flex-wrap: wrap;
      }

      .button {
        width: 100%;
        min-width: unset;
        margin-top: 8px;
      }
    }
  </style>
</head>

  /* =====================================================
     DISTÂNCIA
     
     Distância geográfica em linha reta.
     Não representa a distância de carro.
     ===================================================== */

  function calcularDistancia(
    lat1,
    lon1,
    lat2,
    lon2
  ) {

    const R = 6371;

    const dLat =
      (lat2 - lat1) *
      Math.PI / 180;

    const dLon =
      (lon2 - lon1) *
      Math.PI / 180;

    const a =
      Math.sin(dLat / 2) *
      Math.sin(dLat / 2) +

      Math.cos(
        lat1 * Math.PI / 180
      ) *

      Math.cos(
        lat2 * Math.PI / 180
      ) *

      Math.sin(dLon / 2) *
      Math.sin(dLon / 2);

    const c =
      2 *
      Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1 - a)
      );

    return R * c;

  }


  /* =====================================================
     VIA CEP
     ===================================================== */

  async function consultarViaCEP(cep) {

    const response =
      await fetch(
        "https://viacep.com.br/ws/" +
        cep +
        "/json/"
      );

    if (!response.ok) {
      throw new Error(
        "Erro no ViaCEP"
      );
    }

    const data =
      await response.json();

    if (data.erro) {
      return null;
    }

    return data;

  }


  /* =====================================================
     LOCALIZAÇÃO DO USUÁRIO
     
     Tenta primeiro o CEP.
     Depois tenta o endereço completo.
     ===================================================== */

  async function localizarCEP(
    cep,
    dados
  ) {

    const consultas = [

      "https://nominatim.openstreetmap.org/search" +
      "?format=jsonv2" +
      "&limit=1" +
      "&countrycodes=br" +
      "&postalcode=" +
      encodeURIComponent(cep),

      "https://nominatim.openstreetmap.org/search" +
      "?format=jsonv2" +
      "&limit=1" +
      "&countrycodes=br" +
      "&q=" +
      encodeURIComponent(
        [
          dados.logradouro,
          dados.bairro,
          dados.localidade,
          dados.uf,
          "Brasil"
        ]
        .filter(Boolean)
        .join(", ")
      )

    ];


    for (
      const url of consultas
    ) {

      try {

        const response =
          await fetch(
            url,
            {
              headers: {
                "Accept":
                  "application/json"
              }
            }
          );

        if (!response.ok) {
          continue;
        }

        const resultado =
          await response.json();

        if (
          resultado &&
          resultado.length > 0
        ) {

          const lat =
            parseFloat(
              resultado[0].lat
            );

          const lon =
            parseFloat(
              resultado[0].lon
            );

          if (
            Number.isFinite(lat) &&
            Number.isFinite(lon)
          ) {

            return {
              lat: lat,
              lon: lon
            };

          }

        }

      } catch (erro) {

        console.error(
          "Erro ao localizar:",
          erro
        );

      }

    }

    return null;

  }


  /* =====================================================
     ENCONTRA UNIDADE MAIS PRÓXIMA
     ===================================================== */

  function encontrarMaisProxima(
    latitude,
    longitude,
    unidades
  ) {

    if (
      !Number.isFinite(latitude) ||
      !Number.isFinite(longitude)
    ) {

      return null;

    }

    let melhor =
      null;


    for (
      const unidade of unidades
    ) {

      const distancia =
        calcularDistancia(
          latitude,
          longitude,
          unidade.lat,
          unidade.lon
        );


      if (
        melhor === null ||
        distancia < melhor.distancia
      ) {

        melhor = {
          ...unidade,
          distancia: distancia
        };

      }

    }


    return melhor;

  }

    try {

         1. VIA CEP

        );


      if (!dados) {

        result.style.display =
          "block";

        result.classList.add(
          "error"
        );

        resultAddress.textContent =
          "Não encontramos esse CEP. Verifique os números e tente novamente.";

        return;

      }


      /* ================================================
         2. MOSTRA ENDEREÇO
         ================================================ */

      resultAddress.innerHTML =

        (
          dados.logradouro ||
          "Endereço não informado"
        ) +

        "<br>" +

        (
          dados.bairro ||
          ""
        ) +

        "<br>" +

        (
          dados.localidade ||
          ""
        ) +

        " - " +

        (
          dados.uf ||
          ""
        );


      result.style.display =
        "block";


      /* ================================================
         3. LOCALIZA O USUÁRIO
         ================================================ */

      let coordenadas =
        await localizarCEP(
          cep,
          dados
        );


      /*
        Fallback específico para o CEP utilizado
        nos testes de Bangu.

        Rua Lúcio Alves - Bangu.
      */

      if (
        !coordenadas &&
        cep === "21863430"
      ) {

        coordenadas = {
          lat: -22.85578,
          lon: -43.46772
        };

      }


      /*
        Fallback específico para o CEP
        oficial da Rua Guarama.

        É utilizado somente se o serviço de
        geocodificação não responder.
      */

      if (
        !coordenadas &&
        cep === "21510230"
      ) {

        coordenadas = {
          lat: -22.84083,
          lon: -43.34720
        };

      }


      if (!coordenadas) {

        crasAddress.textContent =
          "Encontramos o endereço, mas não foi possível localizar geograficamente o CEP.";

        crasDistance.textContent =
          "Tente novamente ou ligue 1746 da Prefeitura para orientação.";

        womanAddress.textContent =
          "Encontramos o endereço, mas não foi possível localizar geograficamente o CEP.";

        womanDistance.textContent =
          "Tente novamente ou ligue 1746 da Prefeitura para orientação.";

        return;

      }


      console.log(
        "CEP:",
        cep
      );

      console.log(
        "Latitude:",
        coordenadas.lat
      );

      console.log(
        "Longitude:",
        coordenadas.lon
      );


      /* ================================================
         4. CRAS MAIS PRÓXIMO
         ================================================ */

      const crasMaisProximo =
        encontrarMaisProxima(
          coordenadas.lat,
          coordenadas.lon,
          cras
        );


      /* ================================================
         5. CASA DA MULHER MAIS PRÓXIMA
         ================================================ */

      const casaMaisProxima =
        encontrarMaisProxima(
          coordenadas.lat,
          coordenadas.lon,
          casasDaMulher
        );


      /* ================================================
         6. MOSTRA RESULTADOS
         ================================================ */

      mostrarCras(
        crasMaisProximo
      );

      mostrarCasa(
        casaMaisProxima
      );


    } catch (erro) {

      console.error(
        "Erro na busca:",
        erro
      );


      result.style.display =
        "block";

      result.classList.add(
        "error"
      );


      resultAddress.textContent =
        "Não foi possível realizar a busca neste momento. Tente novamente.";


      crasAddress.textContent =
        "Não foi possível localizar o CRAS.";


      womanAddress.textContent =
        "Não foi possível localizar a Casa da Mulher.";

    } finally {

      searchButton.textContent =
        "ENCONTRAR";

      searchButton.disabled =
        false;

    }

  }


  /* =====================================================
     BOTÃO ENCONTRAR
     ===================================================== */

  searchButton.addEventListener(
    "click",
    realizarBusca
  );


  /* =====================================================
     ENTER NO CAMPO DE CEP
     ===================================================== */

  cepInput.addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter"
      ) {

        realizarBusca();

      }

    }
  );

</script>

</body>
</html>
