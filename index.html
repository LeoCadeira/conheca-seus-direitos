<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Conheça seus direitos</title>

    <style>
      :root {
        --bg: #f4e4dc;
        --card: #f8f2ee;
        --primary: #d37586;
        --primary-dark: #b5526e;
        --text: #402d35;
        --muted: #7b5d65;
        --line: rgba(96, 63, 71, 0.18);
        --button: #d98ca1;
        --button-dark: #b9617d;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(
            circle at top,
            #f9f0eb 0%,
            #f1e4df 35%,
            #e8d8d2 100%
          );
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
        padding: 20px;
      }

      .card {
        width: 420px;
        max-width: 100%;
        background: rgba(255, 255, 255, 0.2);
        border: 1px solid rgba(120, 83, 91, 0.15);
        border-radius: 22px;
        box-shadow: 0 18px 30px rgba(86, 50, 58, 0.12);
        padding: 18px 18px 22px;
        backdrop-filter: blur(2px);
      }

      .inner {
        background: var(--card);
        border: 1px solid rgba(116, 73, 82, 0.08);
        border-radius: 18px;
        padding: 18px 18px 14px;
      }

      .title {
        text-align: center;
        font-weight: 800;
        font-size: 1.05rem;
        letter-spacing: 0.04em;
        color: #6a4650;
        margin: 0 0 16px;
        line-height: 1.3;
      }

      .search-label {
        display: block;
        font-size: 0.78rem;
        color: var(--muted);
        margin-bottom: 8px;
        text-align: center;
        font-weight: 700;
      }

      .search {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        margin-bottom: 14px;
      }

      .input-wrap {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .input {
        width: 100%;
        max-width: 220px;
        height: 38px;
        border: 1px solid rgba(116, 73, 82, 0.18);
        border-radius: 8px;
        background: #fff;
        padding: 0 12px;
        font-size: 0.98rem;
        color: var(--text);
        outline: none;
      }

      .input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 2px rgba(211, 117, 134, 0.12);
      }

      .input::placeholder {
        color: #b19aa4;
      }

      .button {
        height: 38px;
        min-width: 104px;
        border: none;
        border-radius: 8px;
        background: linear-gradient(
          180deg,
          var(--button) 0%,
          var(--button-dark) 100%
        );
        color: #fff;
        font-weight: 700;
        letter-spacing: 0.05em;
        cursor: pointer;
        box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.08);
        transition: transform 0.15s ease, opacity 0.15s ease;
      }

      .button:hover {
        transform: translateY(-1px);
      }

      .button:disabled {
        opacity: 0.65;
        cursor: wait;
        transform: none;
      }

      .divider {
        border-top: 1px solid var(--line);
        margin: 18px 0 12px;
      }

      .result {
        background: #fff;
        border: 1px solid rgba(116, 73, 82, 0.12);
        border-radius: 10px;
        padding: 12px;
        margin: 14px 4px;
        color: var(--muted);
        font-size: 0.8rem;
        line-height: 1.5;
      }

      .result-title {
        color: var(--text);
        font-weight: 800;
        margin-bottom: 5px;
      }

      .service {
        display: grid;
        grid-template-columns: 36px 1fr;
        gap: 10px;
        padding: 8px 4px 6px;
      }

      .icon {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: rgba(221, 170, 186, 0.22);
        display: grid;
        place-items: center;
        font-size: 1.2rem;
        margin-top: 2px;
      }

      .service-card {
        border: 1px solid transparent;
        padding: 0;
      }

      .service-name {
        font-size: 0.8rem;
        font-weight: 800;
        color: var(--text);
        margin: 0 0 6px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .address {
        font-size: 0.8rem;
        color: var(--muted);
        line-height: 1.5;
        margin: 0 0 4px;
      }

      .distance {
        font-size: 0.76rem;
        color: var(--muted);
        margin: 0 0 8px;
      }

      .cta {
        display: inline-block;
        height: 28px;
        padding: 0 12px;
        border: none;
        background: rgba(201, 118, 146, 0.1);
        color: var(--primary-dark);
        border-radius: 6px;
        font-weight: 800;
        font-size: 0.7rem;
        letter-spacing: 0.05em;
        cursor: pointer;
      }

      @media (max-width: 480px) {
        body {
          padding: 12px;
        }

        .card {
          width: 100%;
        }

        .search {
          flex-wrap: wrap;
        }

        .button {
          width: 100%;
          min-width: unset;
          margin-top: 8px;
        }

        .input-wrap {
          width: 100%;
        }

        .input {
          max-width: none;
        }
      }
    </style>
  </head>

  <body>
    <div class="card">
      <div class="inner">

        <h1 class="title">
          CONHEÇA SEUS DIREITOS
        </h1>

        <div class="search-label">
          Digite seu CEP
        </div>

        <div class="search">

          <div class="input-wrap">
            <input
              class="input"
              type="text"
              placeholder="00000-000"
              maxlength="9"
              inputmode="numeric"
              autocomplete="postal-code"
            />
          </div>

          <button class="button">
            ENCONTRAR
          </button>

        </div>

        <div class="divider"></div>

        <!-- Resultado do CEP -->

        <div
          id="result"
          class="result"
          style="display: none;"
        >
          <div class="result-title">
            📍 Sua localização
          </div>

          <div id="result-address"></div>
        </div>

        <!-- CRAS -->

        <div class="service">

          <div class="icon">
            📍
          </div>

          <div class="service-card">

            <p class="service-name">
              CRAS mais próximo
            </p>

            <p class="address">
              endereço
            </p>

            <p class="distance">
              distância
            </p>

            <button class="cta">
              COMO CHEGAR
            </button>

          </div>

        </div>

        <div
          class="divider"
          style="margin-top: 14px; margin-bottom: 10px;"
        ></div>

        <!-- Casa da Mulher -->

        <div class="service">

          <div class="icon">
            👩
          </div>

          <div class="service-card">

            <p class="service-name">
              Casa da Mulher mais próxima
            </p>

            <p class="address">
              endereço
            </p>

            <p class="distance">
              distância
            </p>

            <button class="cta">
              COMO CHEGAR
            </button>

          </div>

        </div>

      </div>
    </div>

    <script>
      const cepInput = document.querySelector(".input");
      const searchButton = document.querySelector(".button");

      const result = document.querySelector("#result");
      const resultAddress = document.querySelector("#result-address");

      // Formatação automática do CEP

      cepInput.addEventListener("input", function (e) {

        let value = e.target.value.replace(/\D/g, "");

        if (value.length > 5) {
          value =
            value.slice(0, 5) +
            "-" +
            value.slice(5, 8);
        }

        e.target.value = value.slice(0, 9);

      });


      // Busca do CEP

      searchButton.addEventListener("click", async function () {

        const cep = cepInput.value.replace(/\D/g, "");

        if (cep.length !== 8) {

          result.style.display = "block";

          resultAddress.innerHTML =
            "Digite um CEP válido para continuar.";

          return;
        }

        searchButton.textContent = "BUSCANDO...";
        searchButton.disabled = true;

        result.style.display = "none";

        try {

          const response = await fetch(
            `https://viacep.com.br/ws/${cep}/json/`
          );

          const data = await response.json();

          if (data.erro) {

            result.style.display = "block";

            resultAddress.innerHTML =
              "Não encontramos esse CEP. Verifique os números e tente novamente.";

            return;
          }


          // Mostra o endereço encontrado

          resultAddress.innerHTML = `
            ${data.logradouro || "Endereço não informado"}<br>
            ${data.bairro || ""}<br>
            ${data.localidade} - ${data.uf}
          `;

          result.style.display = "block";


        } catch (error) {

          result.style.display = "block";

          resultAddress.innerHTML =
            "Não foi possível consultar o CEP. Tente novamente.";

        } finally {

          searchButton.textContent = "ENCONTRAR";
          searchButton.disabled = false;

        }

      });
    </script>

  </body>
</html>
