    name="viewport"

  >

  <title>Conheça seus direitos</title>


  <style>

    :root {

      --card: #f8f2ee;

      --primary: #d37586;

      --primary-dark: #b5526e;

      --text: #402d35;

      --muted: #7b5d65;

      --line: rgba(96, 63, 71, 0.18);

      --button: #d98ca1;

      --button-dark: #b9617d;

      --white: #ffffff;

      --success-bg: #f7eef0;

    }


    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      display: grid;

      place-items: center;

      background:
        radial-gradient(
          circle at top,
          #f9f0eb 0%,
          #f1e4df 35%,
          #e8d8d2 100%
        );

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: var(--text);

      padding: 20px;

    }


    .card {

      width: 420px;

      max-width: 100%;

      background:
        rgba(255, 255, 255, 0.2);

      border:
        1px solid
        rgba(120, 83, 91, 0.15);

      border-radius: 22px;

      box-shadow:
        0 18px 30px
        rgba(86, 50, 58, 0.12);

      padding: 18px;

      backdrop-filter: blur(2px);

    }


    .inner {

      background: var(--card);

      border:
        1px solid
        rgba(116, 73, 82, 0.08);

      border-radius: 18px;

      padding: 18px;

    }


    .title {

      text-align: center;

      font-weight: 800;

      font-size: 1.05rem;

      letter-spacing: 0.04em;

      color: #6a4650;

      margin:
        0 0 16px;

      line-height: 1.3;

    }


    .search-label {

      display: block;

      font-size: 0.78rem;

      color: var(--muted);

      margin-bottom: 8px;

      text-align: center;

      font-weight: 700;

    }


    .search {

      display: flex;

      align-items: center;

      gap: 8px;

      margin-bottom: 14px;

    }


    .input-wrap {

      width: 100%;

    }


    .input {

      width: 100%;

      height: 38px;

      border:
        1px solid
        rgba(116, 73, 82, 0.18);

      border-radius: 8px;

      background: var(--white);

      padding:
        0 12px;

      font-size: 0.98rem;

      color: var(--text);

      outline: none;

    }


    .input:focus {

      border-color:
        var(--primary);

      box-shadow:
        0 0 0 2px
        rgba(211, 117, 134, 0.12);

    }


    .input::placeholder {

      color: #b19aa4;

    }


    .button {

      height: 38px;

      min-width: 104px;

      border: none;

      border-radius: 8px;

      background:
        linear-gradient(
          180deg,
          var(--button) 0%,
          var(--button-dark) 100%
        );

      color: #fff;

      font-weight: 700;

      letter-spacing: 0.05em;

      cursor: pointer;

      transition: 0.15s;

    }


    .button:hover {

      transform:
        translateY(-1px);

    }


    .button:disabled {

      opacity: 0.65;

      cursor: wait;

    }


    .divider {

      border-top:
        1px solid
        var(--line);

      margin:
        18px 0 12px;

    }


    .result {

      background: #fff;

      border:
        1px solid
        rgba(116, 73, 82, 0.12);

      border-radius: 10px;

      padding: 12px;

      margin:
        14px 4px;

      color: var(--muted);

      font-size: 0.8rem;

      line-height: 1.5;

    }


    .result-title {

      color: var(--text);

      font-weight: 800;

      margin-bottom: 5px;

    }


    .service {

      display: grid;

      grid-template-columns:
        36px 1fr;

      gap: 10px;

      padding:
        8px 4px 6px;

    }


    .icon {

      width: 30px;

      height: 30px;

      border-radius: 50%;

      background:
        rgba(221, 170, 186, 0.22);

      display: grid;

      place-items: center;

      font-size: 1.2rem;

      margin-top: 2px;

    }


    .service-card {

      padding: 0;

    }


    .service-name {

      font-size: 0.82rem;

      font-weight: 800;

      color: var(--text);

      margin:
        0 0 6px;

    }


    .address {

      font-size: 0.8rem;

      color: var(--muted);

      line-height: 1.5;

      margin:
        0 0 6px;

    }


    .distance {

      font-size: 0.76rem;

      color: var(--muted);

      margin:
        0 0 8px;

    }


    .info {

      font-size: 0.76rem;

      color: var(--muted);

      line-height: 1.5;

      margin:
        4px 0;

    }


    .cta {

      display: inline-block;

      height: 30px;

      padding:
        0 12px;

      border: none;

      background:
        rgba(201, 118, 146, 0.1);

      color: var(--primary-dark);

      border-radius: 6px;

      font-weight: 800;

      font-size: 0.7rem;

      letter-spacing: 0.05em;

      cursor: pointer;

      text-decoration: none;

      margin-top: 5px;

      margin-right: 4px;

    }


    .cta:hover {

      background:
        rgba(201, 118, 146, 0.18);

    }


    .phone {

      background:
        rgba(201, 118, 146, 0.16);

    }


    .loading {

      text-align: center;

      color: var(--muted);

      font-size: 0.8rem;

      padding: 10px;

    }


    .error {

      color: #9a4357;

      background: #fff4f5;

      border:
        1px solid
        #ecc8cf;

    }


    .success {

      background:
        var(--success-bg);

    }


    strong {

      color: var(--text);

    }


    @media (max-width: 480px) {

      body {

        padding: 12px;

      }


      .card {

        width: 100%;

      }


      .search {

        flex-wrap: wrap;

      }


      .button {

        width: 100%;

        min-width: unset;

        margin-top: 8px;

      }

    }

  </style>

</head>

/* =========================================================
   NORMALIZAÇÃO DE TEXTO
========================================================= */


function normalizar(texto) {

  return (texto || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(
      /[\u0300-\u036f]/g,
      ""
    )
    .trim();

}



/* =========================================================
   FORMATAÇÃO DO CEP
========================================================= */


cepInput.addEventListener(
  "input",
  function (e) {

    let value =
      e.target.value
        .replace(/\D/g, "");

    if (value.length > 5) {

      value =
        value.slice(0, 5) +
        "-" +
        value.slice(5, 8);

    }

    e.target.value =
      value.slice(0, 9);

  }
);

  womanHours.textContent = "";

    "none";

  womanCall.style.display =
    "none";

}

/* =========================================================
   DISTÂNCIA
   Usada somente para a Casa da Mulher.
========================================================= */


function calcularDistancia(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R = 6371;


  const dLat =
    (lat2 - lat1) *
    Math.PI / 180;


  const dLon =
    (lon2 - lon1) *
    Math.PI / 180;


  const a =

    Math.sin(dLat / 2) *
    Math.sin(dLat / 2)

    +

    Math.cos(
      lat1 *
      Math.PI /
      180
    )

    *

    Math.cos(
      lat2 *
      Math.PI /
      180
    )

    *

    Math.sin(dLon / 2) *
    Math.sin(dLon / 2);


  const c =
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );


  return R * c;

}



/* =========================================================
   GEOCODIFICAÇÃO
========================================================= */


async function geocodificar(
  endereco
) {

  const url =

    "https://nominatim.openstreetmap.org/search" +

    "?format=json" +

    "&limit=1" +

    "&countrycodes=br" +

    "&q=" +

    encodeURIComponent(
      endereco
    );


  const response =
    await fetch(
      url,
      {
        headers: {
          "Accept":
            "application/json"
        }
      }
    );


  if (!response.ok) {

    throw new Error(
      "Falha na geolocalização"
    );

  }


  const data =
    await response.json();


  if (!data.length) {

    return null;

  }


  return {

    lat:
      parseFloat(
        data[0].lat
      ),

    lon:
      parseFloat(
        data[0].lon
      )

  };

}



/* =========================================================
   CASA DA MULHER MAIS PRÓXIMA
========================================================= */


async function encontrarCasaMaisProxima(
  latitude,
  longitude
) {


  const casas =
    [];


  for (
    const casa
    of casasDaMulher
  ) {

    try {

      const coordenadas =
        await geocodificar(
          casa.endereco
        );


      if (coordenadas) {

        const distancia =
          calcularDistancia(

            latitude,
            longitude,

            coordenadas.lat,
            coordenadas.lon

          );


        casas.push({

          ...casa,

          ...coordenadas,

          distancia

        });

      }


    } catch (erro) {

      console.log(
        "Não foi possível localizar:",
        casa.nome
      );

    }


    await new Promise(
      resolve =>
        setTimeout(
          resolve,
          800
        )
    );

  }


  if (!casas.length) {

    return null;

  }


  casas.sort(
    (a, b) =>
      a.distancia -
      b.distancia
  );


  return casas[0];

}

/* =========================================================
   BUSCA PRINCIPAL
========================================================= */


searchButton.addEventListener(
  "click",
  async function () {


    const cep =
      cepInput.value
        .replace(/\D/g, "");


    if (
      cep.length !== 8
    ) {

      result.style.display =
        "block";

      result.classList.add(
        "error"
      );

      resultAddress.innerHTML =
        "Digite um CEP válido para continuar.";

      return;

    }


    searchButton.textContent =
      "BUSCANDO...";

    searchButton.disabled =
      true;


    result.style.display =
      "none";

    result.classList.remove(
      "error"
    );


    limparResultados();


    try {


      /* ===============================================
         1. CONSULTA O CEP
      =============================================== */


      const response =
        await fetch(

          "https://viacep.com.br/ws/" +

          cep +

          "/json/"

        );


      if (!response.ok) {

        throw new Error(
          "Erro na consulta do CEP"
        );

      }


      const data =
        await response.json();


      if (data.erro) {

        result.style.display =
          "block";

        result.classList.add(
          "error"
        );

        resultAddress.innerHTML =
          "Não encontramos esse CEP. Verifique os números e tente novamente.";

        return;

      }


      /* ===============================================
         2. MOSTRA ENDEREÇO
      =============================================== */


      resultAddress.innerHTML =

        (
          data.logradouro ||
          "Endereço não informado"
        )

        +

        "<br>" +

        (
          data.bairro ||
          ""
        )

        +

        "<br>" +

        data.localidade +

        " - " +

        data.uf;


      result.style.display =
        "block";


      /* ===============================================
         3. DESCOBRE O BAIRRO
      =============================================== */


      const bairro =
        normalizar(
          data.bairro
        );


      /* ===============================================
         4. PROCURA CRAS POR ABRANGÊNCIA
      =============================================== */


      let crasEncontrado =
        null;


      for (
        const cras
        of crasList
      ) {

        const encontrou =
          cras.bairros.some(
            item =>
              normalizar(item)
              === bairro
          );


        if (encontrou) {

          crasEncontrado =
            cras;

          break;

        }

      }


      mostrarCras(
        crasEncontrado
      );


      /* ===============================================
         5. LOCALIZAÇÃO DO USUÁRIO
         PARA CASA DA MULHER
      =============================================== */


      const enderecoUsuario = [

        data.logradouro,

        data.bairro,

        data.localidade,

        data.uf,

        "Brasil"

      ]
        .filter(Boolean)
        .join(", ");


      const coordenadasUsuario =
        await geocodificar(
          enderecoUsuario
        );


      if (!coordenadasUsuario) {

        womanAddress.textContent =
          "Encontramos o endereço, mas não foi possível calcular a Casa da Mulher mais próxima.";

        return;

      }


      /* ===============================================
         6. CASA DA MULHER
      =============================================== */


      const casaMaisProxima =
        await encontrarCasaMaisProxima(

          coordenadasUsuario.lat,

          coordenadasUsuario.lon

        );


      mostrarCasa(
        casaMaisProxima
      );


    }

    catch (erro) {

      console.error(
        erro
      );


      result.style.display =
        "block";

      result.classList.add(
        "error"
      );


      resultAddress.innerHTML =

        "Não foi possível realizar a busca neste momento. " +

        "Verifique sua conexão e tente novamente.";


      crasAddress.textContent =
        "Não foi possível consultar o CRAS.";

      womanAddress.textContent =
        "Não foi possível consultar a Casa da Mulher.";

    }


    finally {

      searchButton.textContent =
        "ENCONTRAR";

      searchButton.disabled =
        false;

    }

  });


</script>
