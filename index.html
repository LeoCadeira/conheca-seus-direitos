<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Conheça seus direitos</title>

  <style>
    :root {
      --card: #f8f2ee;
      --primary: #d37586;
      --primary-dark: #b5526e;
      --text: #402d35;
      --muted: #7b5d65;
      --line: rgba(96, 63, 71, 0.18);
      --button: #d98ca1;
      --button-dark: #b9617d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(
          circle at top,
          #f9f0eb 0%,
          #f1e4df 35%,
          #e8d8d2 100%
        );
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      padding: 20px;
    }

    .card {
      width: 420px;
      max-width: 100%;
      background: rgba(255,255,255,.2);
      border: 1px solid rgba(120,83,91,.15);
      border-radius: 22px;
      box-shadow: 0 18px 30px rgba(86,50,58,.12);
      padding: 18px;
    }

    .inner {
      background: var(--card);
      border: 1px solid rgba(116,73,82,.08);
      border-radius: 18px;
      padding: 18px;
    }

    .title {
      text-align: center;
      font-weight: 800;
      font-size: 1.05rem;
      letter-spacing: .04em;
      color: #6a4650;
      margin: 0 0 16px;
    }

    .search-label {
      display: block;
      font-size: .78rem;
      color: var(--muted);
      margin-bottom: 8px;
      text-align: center;
      font-weight: 700;
    }

    .search {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .input {
      width: 100%;
      height: 38px;
      border: 1px solid rgba(116,73,82,.18);
      border-radius: 8px;
      background: white;
      padding: 0 12px;
      font-size: .98rem;
      color: var(--text);
      outline: none;
    }

    .button {
      height: 38px;
      min-width: 104px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(
        180deg,
        var(--button),
        var(--button-dark)
      );
      color: white;
      font-weight: 700;
      letter-spacing: .05em;
      cursor: pointer;
    }

    .button:disabled {
      opacity: .65;
      cursor: wait;
    }

    .divider {
      border-top: 1px solid var(--line);
      margin: 18px 0 12px;
    }

    .result {
      background: white;
      border: 1px solid rgba(116,73,82,.12);
      border-radius: 10px;
      padding: 12px;
      margin: 14px 4px;
      color: var(--muted);
      font-size: .8rem;
      line-height: 1.5;
    }

    .result-title {
      color: var(--text);
      font-weight: 800;
      margin-bottom: 5px;
    }

    .error {
      background: #fff4f5;
      border-color: #ecc8cf;
      color: #9a4357;
    }

    .service {
      display: grid;
      grid-template-columns: 36px 1fr;
      gap: 10px;
      padding: 8px 4px 6px;
    }

    .icon {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(221,170,186,.22);
      display: grid;
      place-items: center;
      font-size: 1.2rem;
    }

    .service-name {
      font-size: .8rem;
      font-weight: 800;
      margin: 0 0 6px;
    }

    .address {
      font-size: .8rem;
      color: var(--muted);
      line-height: 1.5;
      margin: 0 0 4px;
    }

    .distance {
      font-size: .76rem;
      color: var(--muted);
      margin: 0 0 8px;
    }

    .cta {
      display: inline-block;
      padding: 7px 12px;
      border: none;
      background: rgba(201,118,146,.1);
      color: var(--primary-dark);
      border-radius: 6px;
      font-weight: 800;
      font-size: .7rem;
      letter-spacing: .05em;
      cursor: pointer;
      text-decoration: none;
    }

    .cta:hover {
      background: rgba(201,118,146,.18);
    }

    @media (max-width:480px) {
      body {
        padding: 12px;
      }

      .search {
        flex-wrap: wrap;
      }

      .button {
        width: 100%;
        margin-top: 8px;
      }
    }
  </style>
</head>

<body>

<div class="card">
  <div class="inner">

    <h1 class="title">
      CONHEÇA SEUS DIREITOS
    </h1>

    <div class="search-label">
      Digite seu CEP
    </div>

    <div class="search">

      <input
        class="input"
        type="text"
        placeholder="00000-000"
        maxlength="9"
        inputmode="numeric"
        autocomplete="postal-code"
      >

      <button class="button">
        ENCONTRAR
      </button>

    </div>

    <div class="divider"></div>

    <div
      id="result"
      class="result"
      style="display:none;"
    >
      <div class="result-title">
        📍 Sua localização
      </div>

      <div id="result-address"></div>
    </div>


    <!-- CRAS -->

    <div class="service">

      <div class="icon">
        📍
      </div>

      <div>

        <p class="service-name">
          CRAS mais próximo
        </p>

        <p class="address">
          Em breve
        </p>

        <p class="distance">
          Estamos preparando essa busca.
        </p>

      </div>

    </div>


    <div class="divider"></div>


    <!-- CASA DA MULHER -->

    <div class="service">

      <div class="icon">
        👩
      </div>

      <div>

        <p class="service-name">
          Casa da Mulher mais próxima
        </p>

        <p
          class="address"
          id="woman-address"
        >
          Digite seu CEP para encontrar.
        </p>

        <p
          class="distance"
          id="woman-distance"
        ></p>

        <a
          id="woman-map"
          class="cta"
          href="#"
          target="_blank"
          style="display:none;"
        >
          COMO CHEGAR
        </a>

      </div>

    </div>

  </div>
</div>


<script>

const cepInput =
  document.querySelector(".input");

const searchButton =
  document.querySelector(".button");

const result =
  document.querySelector("#result");

const resultAddress =
  document.querySelector("#result-address");

const womanAddress =
  document.querySelector("#woman-address");

const womanDistance =
  document.querySelector("#woman-distance");

const womanMap =
  document.querySelector("#woman-map");


/*
  Casas da Mulher Carioca.

  Endereços conferidos nas páginas
  oficiais da Prefeitura do Rio.
*/

const casasDaMulher = [

  {
    nome: "Casa da Mulher Carioca Dinah Coutinho",
    bairro: "Realengo",
    endereco:
      "Rua Limites, 1260 - Realengo, Rio de Janeiro - RJ"
  },

  {
    nome: "Casa da Mulher Carioca Tia Doca",
    bairro: "Madureira",
    endereco:
      "Rua Júlio Fragoso, 47 - Madureira, Rio de Janeiro - RJ"
  },

  {
    nome: "Casa da Mulher Carioca Elza Soares",
    bairro: "Padre Miguel",
    endereco:
      "Avenida Marechal Falcão da Frota, s/n - Padre Miguel, Rio de Janeiro - RJ"
  },

  {
    nome: "Casa da Mulher Carioca - Polo Campo Grande",
    bairro: "Campo Grande",
    endereco:
      "Rua Mário Barbosa, 137 - Campo Grande, Rio de Janeiro - RJ"
  },

  {
    nome: "Casa da Mulher Carioca - Polo Coelho Neto",
    bairro: "Coelho Neto",
    endereco:
      "Avenida Pastor Martin Luther King Jr, 10055 - Coelho Neto, Rio de Janeiro - RJ"
  }

];


/*
  Formata o CEP.
*/

cepInput.addEventListener(
  "input",
  function() {

    let value =
      cepInput.value.replace(/\D/g, "");

    if (value.length > 5) {

      value =
        value.slice(0,5) +
        "-" +
        value.slice(5,8);

    }

    cepInput.value =
      value.slice(0,9);

  }
);


/*
  Geocodifica somente o endereço
  informado pelo CEP.

  Isso evita as cinco consultas
  que estavam causando o erro.
*/

async function localizarEndereco(
  endereco
) {

  const url =
    "https://nominatim.openstreetmap.org/search" +
    "?format=json" +
    "&limit=1" +
    "&countrycodes=br" +
    "&q=" +
    encodeURIComponent(endereco);

  const response =
    await fetch(url);

  if (!response.ok) {
    throw new Error(
      "Erro na localização"
    );
  }

  const data =
    await response.json();

  if (!data.length) {
    return null;
  }

  return {
    lat:
      parseFloat(data[0].lat),

    lon:
      parseFloat(data[0].lon)
  };

}


/*
  Função para abrir o Google Maps.
*/

function criarLinkMapa(
  endereco
) {

  return (
    "https://www.google.com/maps/search/?api=1&query=" +
    encodeURIComponent(endereco)
  );

}


/*
  Estratégia inicial:

  usamos o bairro retornado pelo CEP
  para selecionar uma unidade próxima.

  Depois vamos substituir isso por
  distância geográfica real.
*/

function encontrarCasaPorBairro(
  bairro
) {

  if (!bairro) {
    return casasDaMulher[0];
  }

  const texto =
    bairro
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g,"");


  /*
    Áreas próximas de Realengo /
    Padre Miguel.
  */

  if (
    texto.includes("realengo") ||
    texto.includes("padre miguel") ||
    texto.includes("bangu") ||
    texto.includes("senador camara") ||
    texto.includes("magalhaes bastos")
  ) {

    if (
      texto.includes("padre miguel")
    ) {

      return casasDaMulher[2];

    }

    return casasDaMulher[0];

  }


  /*
    Área de Madureira.
  */

  if (
    texto.includes("madureira") ||
    texto.includes("campinho") ||
    texto.includes("cascadura") ||
    texto.includes("rocha miranda") ||
    texto.includes("turiaçu") ||
    texto.includes("turiaçu")
  ) {

    return casasDaMulher[1];

  }


  /*
    Campo Grande e bairros próximos.
  */

  if (
    texto.includes("campo grande") ||
    texto.includes("inhoaiba") ||
    texto.includes("inhoaíba") ||
    texto.includes("cosmos") ||
    texto.includes("senador vasconcelos") ||
    texto.includes("paciência") ||
    texto.includes("paciencia")
  ) {

    return casasDaMulher[3];

  }


  /*
    Coelho Neto e região.
  */

  if (
    texto.includes("coelho neto") ||
    texto.includes("acari") ||
    texto.includes("anchieta") ||
    texto.includes("iraja") ||
    texto.includes("iraia") ||
    texto.includes("guadalupe") ||
    texto.includes("honorio gurgel") ||
    texto.includes("honório gurgel")
  ) {

    return casasDaMulher[4];

  }


  /*
    Caso não seja possível identificar
    uma região específica, usamos
    Madureira como referência inicial.
  */

  return casasDaMulher[1];

}


/*
  Busca principal.
*/

searchButton.addEventListener(
  "click",
  async function() {

    const cep =
      cepInput.value.replace(/\D/g,"");


    if (cep.length !== 8) {

      result.style.display =
        "block";

      result.classList.add(
        "error"
      );

      resultAddress.textContent =
        "Digite um CEP válido para continuar.";

      return;

    }


    searchButton.disabled =
      true;

    searchButton.textContent =
      "BUSCANDO...";


    womanAddress.textContent =
      "Consultando seu CEP...";

    womanDistance.textContent =
      "";

    womanMap.style.display =
      "none";


    try {

      /*
        Consulta o CEP.
      */

      const response =
        await fetch(
          "https://viacep.com.br/ws/" +
          cep +
          "/json/"
        );


      if (!response.ok) {
        throw new Error(
          "Erro ao consultar CEP"
        );
      }


      const data =
        await response.json();


      if (data.erro) {

        throw new Error(
          "CEP não encontrado"
        );

      }


      /*
        Mostra endereço.
      */

      result.classList.remove(
        "error"
      );

      resultAddress.innerHTML =

        (data.logradouro || "Endereço não informado") +
        "<br>" +

        (data.bairro || "") +
        "<br>" +

        data.localidade +
        " - " +
        data.uf;


      result.style.display =
        "block";


      /*
        Escolhe uma Casa da Mulher
        com base na região do CEP.
      */

      const casa =
        encontrarCasaPorBairro(
          data.bairro
        );


      /*
        Mostra resultado.
      */

      womanAddress.innerHTML =

        "<strong>" +
        casa.nome +
        "</strong><br>" +

        casa.endereco;


      womanDistance.textContent =
        "Unidade indicada para a região do endereço informado.";


      /*
        Google Maps.
      */

      womanMap.href =
        criarLinkMapa(
          casa.endereco
        );


      womanMap.style.display =
        "inline-block";


    }

    catch (erro) {

      console.error(erro);


      result.style.display =
        "block";

      result.classList.add(
        "error"
      );


      if (
        erro.message ===
        "CEP não encontrado"
      ) {

        resultAddress.textContent =
          "Não encontramos esse CEP. Verifique os números e tente novamente.";

        womanAddress.textContent =
          "Digite um CEP válido.";

      }

      else {

        resultAddress.textContent =
          "Não foi possível realizar a busca neste momento. Tente novamente.";

        womanAddress.textContent =
          "Não foi possível localizar a unidade.";

      }

    }

    finally {

      searchButton.disabled =
        false;

      searchButton.textContent =
        "ENCONTRAR";

    }

  }
);

</script>

</body>
</html>
